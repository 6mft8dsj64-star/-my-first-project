name: 은행 환율 갱신
on:
  schedule:
    - cron: "7 2-9 * * 1-5"   # 평일 한국 시간 11:07 ~ 18:07, 1시간마다 (수출입은행은 오전 11시 전후 고시)
  workflow_dispatch: {}        # Actions 탭에서 직접 실행
permissions:
  contents: write
concurrency:
  group: bank-rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 은행 환율 받기
        env:
          RATES_PROVIDER: ${{ vars.RATES_PROVIDER }}
          KEXIM_KEY: ${{ secrets.KEXIM_KEY }}
        run: node scripts/fetch-bank-rates.mjs
      - name: 바뀌었으면 저장소에 올리기
        run: |
          if [ -z "$(git status --porcelain rates-bank.json)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates-bank.json
          git commit -m "Update bank exchange rates"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
